name: integration

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_secrets:
    runs-on: ubuntu-latest
    outputs:
      integration_ready: ${{ steps.check.outputs.integration_ready }}
    steps:
      - id: check
        shell: bash
        env:
          FIBERY_TEST_WORKSPACE: ${{ secrets.FIBERY_TEST_WORKSPACE }}
          FIBERY_TEST_WORKSPACE_HOST: ${{ secrets.FIBERY_TEST_WORKSPACE_HOST }}
          FIBERY_TEST_TOKEN: ${{ secrets.FIBERY_TEST_TOKEN }}
        run: |
          missing=()

          [ -n "$FIBERY_TEST_WORKSPACE" ] || missing+=("FIBERY_TEST_WORKSPACE")
          [ -n "$FIBERY_TEST_WORKSPACE_HOST" ] || missing+=("FIBERY_TEST_WORKSPACE_HOST")
          [ -n "$FIBERY_TEST_TOKEN" ] || missing+=("FIBERY_TEST_TOKEN")

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "integration_ready=true" >> "$GITHUB_OUTPUT"
            echo "Integration tests will run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "integration_ready=false" >> "$GITHUB_OUTPUT"
          echo "Integration tests skipped. Missing secrets: ${missing[*]}." >> "$GITHUB_STEP_SUMMARY"

  integration:
    needs: check_secrets
    if: ${{ needs.check_secrets.outputs.integration_ready == 'true' }}
    runs-on: ubuntu-latest
    env:
      FIBERY_TEST_WORKSPACE: ${{ secrets.FIBERY_TEST_WORKSPACE }}
      FIBERY_TEST_WORKSPACE_HOST: ${{ secrets.FIBERY_TEST_WORKSPACE_HOST }}
      FIBERY_TEST_TOKEN: ${{ secrets.FIBERY_TEST_TOKEN }}
      FIBERY_TEST_SANDBOX_SPACE: ${{ secrets.FIBERY_TEST_SANDBOX_SPACE }}
      FIBERY_TEST_SANDBOX_DB: ${{ secrets.FIBERY_TEST_SANDBOX_DB }}
      FIBERY_TEST_TASK_TYPE: ${{ secrets.FIBERY_TEST_TASK_TYPE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pytest --with httpx pytest tests/test_integration.py -v
